<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Побег из подземелья</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0505; font-family:-apple-system, sans-serif; user-select:none; }
  canvas { display:block; touch-action:none; }
  #ui { position:fixed; top:0; left:0; width:100%; pointer-events:none; z-index:10; padding:10px; }
  #topBar { display:flex; justify-content:space-between; align-items:center; padding:0 8px; }
  #scoreBox, #coinBox { color:#fff; font-size:20px; font-weight:900; text-shadow:0 0 6px #ffb400, 2px 2px 0 #000; display:flex; align-items:center; gap:6px; }
  #scoreBox { color:#fff; }
  #hearts { display:flex; gap:4px; font-size:22px; }
  .heart { filter:drop-shadow(0 0 4px #ff0044); }
  #pauseBtn { pointer-events:auto; font-size:26px; color:#fff; background:rgba(0,0,0,.5); border:2px solid #ffb400; border-radius:8px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #startScreen, #gameOverScreen {
    position:fixed; inset:0; background:rgba(0,0,0,.85);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; z-index:20; text-align:center; padding:20px;
  }
  #startScreen h1, #gameOverScreen h1 { font-size:38px; color:#ffb400; text-shadow:0 0 15px #ff5500; margin-bottom:20px; letter-spacing:2px; }
  #startScreen p, #gameOverScreen p { font-size:16px; opacity:.8; margin-bottom:30px; line-height:1.5; max-width:300px; }
  .btn { background:linear-gradient(180deg,#ff5500,#aa2200); color:#fff; border:3px solid #ffb400; border-radius:12px; font-size:22px; font-weight:900; padding:14px 36px; cursor:pointer; text-shadow:1px 1px 0 #000; box-shadow:0 4px 0 #551100, 0 0 20px rgba(255,85,0,.5); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #551100; }
  #finalScore { font-size:28px; color:#ffb400; margin:10px 0 20px; }
  #hint { position:fixed; bottom:30px; width:100%; text-align:center; color:rgba(255,255,255,.7); font-size:14px; pointer-events:none; z-index:15; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="ui">
  <div id="topBar">
    <div id="pauseBtn">⏸</div>
    <div id="scoreBox">📏 <span id="scoreVal">0</span>м</div>
    <div id="coinBox">🪙 <span id="coinVal">0</span></div>
    <div id="hearts"><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span></div>
  </div>
</div>
<div id="hint">Держи палец и води влево-вправо</div>

<div id="startScreen">
  <h1>ПОБЕГ</h1>
  <p>Персонаж летит вверх и ускоряется.<br>Держи палец на экране — управляй движением влево-вправо.<br>Избегай шипов, пил и лазеров.<br>Не дай собаке «БАТЯ» догнать тебя!</p>
  <button class="btn" id="startBtn">НАЧАТЬ</button>
</div>

<div id="gameOverScreen" class="hidden">
  <h1>💀 ПОЙМАЛИ</h1>
  <div id="finalScore">0 м</div>
  <p>Собака БАТЯ догнала тебя.</p>
  <button class="btn" id="restartBtn">ЗАНОВО</button>
</div>

<canvas id="game"></canvas>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// ========================
// НАСТРОЙКИ
// ========================
const CW = window.innerWidth;
const CH = window.innerHeight;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CW;
canvas.height = CH;

const scoreVal = document.getElementById('scoreVal');
const coinVal = document.getElementById('coinVal');
const heartsEl = document.querySelectorAll('.heart');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const hintEl = document.getElementById('hint');

// Если внутри Telegram — раскрыть на весь экран
try { window.Telegram?.WebApp?.ready(); window.Telegram?.WebApp?.expand(); } catch(e) {}

// ========================
// СПРАЙТЫ (атласы)
// ========================
const playerImg = new Image();  playerImg.src = 'assets/player.png';
const enemiesImg = new Image(); enemiesImg.src = 'assets/enemies.png';
const tilesImg = new Image();   tilesImg.src = 'assets/tiles.png';

let imgsLoaded = 0;
[playerImg, enemiesImg, tilesImg].forEach(img => {
  img.onload = () => { imgsLoaded++; };
  img.onerror = () => { console.warn('Не загрузилось:', img.src); imgsLoaded++; };
});

// ========================
// АТЛАСЫ — координаты кадров
// (подбираются визуально под твои спрайты)
// ========================
// Игрок: лист 1024x1024, 6 колонок × 2 строки
const PLAYER_FRAMES = {
  // верхняя строка — полёт (кадры 0-1), ходьба (2-5)
  fly:    [{x:10,  y:30, w:160, h:180}, {x:180, y:30, w:160, h:180}],
  walkR:  [{x:355, y:30, w:160, h:180}, {x:525, y:30, w:160, h:180}, {x:690, y:30, w:160, h:180}, {x:850, y:30, w:160, h:180}],
  // нижняя строка — ходьба влево (зеркально)
  walkL:  [{x:10,  y:250, w:160, h:180}, {x:180, y:250, w:160, h:180}, {x:355, y:250, w:160, h:180}, {x:525, y:250, w:160, h:180}, {x:690, y:250, w:160, h:180}, {x:850, y:250, w:160, h:180}]
};

// Собака: лист с врагами (нижняя часть). Возьмём средний кадр
const DOG_FRAME = {x:20, y:700, w:200, h:180};
const DOG_FRAME2 = {x:230, y:700, w:200, h:180};

// Пауки: лист 2
const SPIDER_GREEN  = {x:30,  y:30,  w:150, h:130};
const SPIDER_PURPLE = {x:30,  y:260, w:150, h:130};
const SPIDER_HANG   = {x:560, y:100, w:120, h:180};

// Пила
const SAW_BIG   = {x:30,  y:520, w:210, h:210};
const SAW_SMALL = {x:770, y:800, w:190, h:190};

// Шипы
const SPIKES_4 = {x:320, y:520, w:250, h:110};
const SPIKES_7 = {x:320, y:850, w:430, h:110};

// Топор
const AXE = {x:320, y:660, w:280, h:120};

// Лазер-пушка
const LASER_OFF = {x:640, y:640, w:130, h:100};
const LASER_ON  = {x:640, y:740, w:360, h:100};

// Паутина (декор)
const WEB = {x:830, y:40, w:170, h:170};

// Монета (из tiles.png — верхний левый угол, 6 кадров вращения)
const COIN_FRAMES = [
  {x:20,  y:30, w:60, h:60}, {x:95,  y:30, w:60, h:60}, {x:170, y:30, w:60, h:60},
  {x:245, y:30, w:60, h:60}, {x:320, y:30, w:60, h:60}, {x:395, y:30, w:60, h:60}
];

// ========================
// УТИЛИТА: убрать белый фон у спрайта
// ========================
function drawSprite(img, frame, dx, dy, dw, dh) {
  if (!img.complete || !img.naturalWidth) return;
  // рисуем кадр из атласа на промежуточный canvas, потом убираем белое
  const tmp = document.createElement('canvas');
  tmp.width = frame.w; tmp.height = frame.h;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(img, frame.x, frame.y, frame.w, frame.h, 0, 0, frame.w, frame.h);
  // убираем белые пиксели
  const data = tctx.getImageData(0, 0, frame.w, frame.h);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i], g = px[i+1], b = px[i+2];
    if (r > 240 && g > 240 && b > 240) {
      px[i+3] = 0;
    }
  }
  tctx.putImageData(data, 0, 0);
  ctx.drawImage(tmp, dx, dy, dw, dh);
}

// ========================
// ИГРА
// ========================
let player, dog, obstacles, coins, particles;
let score, coinsCollected, hearts;
let speed, gameOver, running, lastTime, baseSpeed = 1.6;
let fingerX = null;
let dogTimer = 0;

function initGame() {
  player = { x: CW/2, y: CH - 250, w: 60, h: 70, targetX: CW/2 };
  dog = { x: CW/2, y: CH + 100, w: 90, h: 80, animFrame: 0 };
  obstacles = [];
  coins = [];
  particles = [];
  score = 0;
  coinsCollected = 0;
  hearts = 3;
  speed = baseSpeed;
  gameOver = false;
  running = true;
  dogTimer = 0;
  fingerX = null;
  updateUI();
  requestAnimationFrame(loop);
}

function updateUI() {
  scoreVal.textContent = Math.floor(score);
  coinVal.textContent = coinsCollected;
  heartsEl.forEach((h, i) => {
    h.textContent = i < hearts ? '❤️' : '🖤';
  });
}

// Генерация препятствий
function spawnObstacle(y) {
  const type = Math.random();
  const x = 60 + Math.random() * (CW - 180);
  if (type < 0.35) {
    obstacles.push({ type:'spikes', x, y, w: 80, h: 30, dead:false });
  } else if (type < 0.6) {
    obstacles.push({ type:'saw', x, y, w: 60, h: 60, angle:0, dead:false });
  } else if (type < 0.85) {
    obstacles.push({ type:'spider', x, y, w: 50, h: 45, dead:false, vx: (Math.random()>0.5?1:-1) });
  } else {
    obstacles.push({ type:'laser', x: 20, y, w: CW - 40, h: 6, timer: Math.random()*Math.PI*2, dead:false });
  }
}

function spawnCoin(y) {
  coins.push({ x: 60 + Math.random() * (CW-120), y, w: 30, h: 30, frame: 0 });
}

// Цикл
let lastSpawn = 0;
function loop(t) {
  if (!running) return;
  const dt = Math.min(40, t - (lastTime || t)); lastTime = t;

  // ускорение
  speed += dt * 0.00015;
  const move = speed * dt * 0.1;
  score += move * 0.3;

  // движение игрока
  if (fingerX !== null) {
    player.x += (fingerX - player.x) * 0.15;
  }
  player.x = Math.max(30, Math.min(CW-30, player.x));
  player.y += move * 0.3;

  // собака
  dogTimer += dt;
  const dogSpeed = 0.12 + Math.min(0.5, score * 0.0005);
  dog.y -= move * dogSpeed;
  dog.animFrame = Math.floor(t / 120) % 2;
  dog.x += (player.x - dog.x) * 0.02;

  // камера вверх
  if (player.y < CH * 0.55) {
    const diff = CH * 0.55 - player.y;
    player.y = CH * 0.55;
    dog.y += diff * 0.98;
    obstacles.forEach(o => o.y += diff);
    coins.forEach(c => c.y += diff);
    score += diff * 0.15;
  }

  // генерация
  lastSpawn += move;
  if (lastSpawn > 220) {
    lastSpawn = 0;
    spawnObstacle(CH + 80);
    if (Math.random() < 0.4) spawnCoin(CH - 400);
  }

  // обработка препятствий
  obstacles.forEach(o => {
    if (o.dead) return;
    if (o.type === 'saw') o.angle += dt * 0.01;
    if (o.type === 'laser') o.timer += dt * 0.003;
    if (o.type === 'spider') {
      o.x += o.vx * 0.5;
      if (o.x < 30 || o.x > CW-80) o.vx *= -1;
    }
    // лазер мигает
    if (o.type === 'laser') {
      o.on = Math.sin(o.timer) > 0;
      if (o.on) {
        // коллизия
        if (player.y + 30 > o.y && player.y - 30 < o.y + o.h) {
          hitPlayer();
          o.dead = true;
        }
      }
    } else {
      // обычная коллизия
      if (Math.abs(player.x - (o.x + o.w/2)) < (o.w/2 + 15) &&
          Math.abs(player.y - (o.y + o.h/2)) < (o.h/2 + 20)) {
        hitPlayer();
        o.dead = true;
      }
    }
  });

  // монеты
  coins = coins.filter(c => !c.dead);
  coins.forEach(c => {
    c.frame = Math.floor(t / 100) % 6;
    if (Math.abs(player.x - (c.x+15)) < 30 && Math.abs(player.y - (c.y+15)) < 30) {
      c.dead = true;
      coinsCollected++;
      for (let i=0; i<8; i++) {
        particles.push({ x:c.x, y:c.y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:20, color:'#ffd700' });
      }
    }
  });

  // удаление мусора
  obstacles = obstacles.filter(o => o.y < CH + 200 && !o.dead);
  coins = coins.filter(c => c.y < CH + 100 && !c.dead);

  // проверка — собака догнала
  if (dog.y < player.y + 20) {
    gameOver = true;
    running = false;
    finalScore.textContent = Math.floor(score) + ' м';
    gameOverScreen.classList.remove('hidden');
    hintEl.classList.add('hidden');
  }

  // частицы
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });

  updateUI();
  render();
  requestAnimationFrame(loop);
}

function hitPlayer() {
  hearts--;
  if (hearts <= 0) {
    gameOver = true;
    running = false;
    finalScore.textContent = Math.floor(score) + ' м';
    gameOverScreen.classList.remove('hidden');
    hintEl.classList.add('hidden');
  }
  // тряска
  canvas.style.transform = 'translate(' + (Math.random()*10-5) + 'px,' + (Math.random()*10-5) + 'px)';
  setTimeout(() => canvas.style.transform = '', 100);
}

// ========================
// ОТРИСОВКА
// ========================
function render() {
  // фон — тёмное подземелье
  const grad = ctx.createLinearGradient(0, 0, 0, CH);
  grad.addColorStop(0, '#0a0202');
  grad.addColorStop(1, '#1a0808');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CW, CH);

  // кирпичная текстура (программная, бесшовная)
  ctx.fillStyle = 'rgba(60,20,15,0.4)';
  const brickH = 20, brickW = 40;
  const offset = (score * 6) % brickH;
  for (let y = -brickH; y < CH + brickH; y += brickH) {
    for (let x = 0; x < CW; x += brickW) {
      const bxx = x + ((Math.floor((y+offset)/brickH) % 2) * brickW/2);
      ctx.fillRect(bxx + 1, y + offset + 1, brickW - 2, brickH - 2);
    }
  }

  // боковые стены
  ctx.fillStyle = 'rgba(30,10,5,0.8)';
  ctx.fillRect(0, 0, 15, CH);
  ctx.fillRect(CW-15, 0, 15, CH);

  // препятствия
  obstacles.forEach(o => {
    if (o.type === 'spikes') {
      drawSprite(enemiesImg, SPIKES_4, o.x, o.y, o.w, o.h);
    } else if (o.type === 'saw') {
      ctx.save();
      ctx.translate(o.x + o.w/2, o.y + o.h/2);
      ctx.rotate(o.angle);
      drawSprite(enemiesImg, SAW_BIG, -o.w/2, -o.h/2, o.w, o.h);
      ctx.restore();
    } else if (o.type === 'spider') {
      drawSprite(enemiesImg, SPIDER_GREEN, o.x, o.y, o.w, o.h);
    } else if (o.type === 'laser') {
      if (o.on) {
        ctx.save();
        ctx.shadowColor = '#ff0044';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ff2244';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(o.x, o.y + o.h/2 - 1, o.w, 2);
        ctx.restore();
      }
    }
  });

  // монеты
  coins.forEach(c => {
    const fr = COIN_FRAMES[c.frame];
    drawSprite(tilesImg, fr, c.x, c.y, c.w, c.h);
  });

  // собака
  const dogFrame = dog.animFrame === 0 ? DOG_FRAME : DOG_FRAME2;
  drawSprite(enemiesImg, dogFrame, dog.x - dog.w/2, dog.y - dog.h/2, dog.w, dog.h);

  // частицы
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 20;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // игрок — кадр полёта с огнём
  const playerFrame = PLAYER_FRAMES.fly[Math.floor(Date.now()/150) % 2];
  ctx.save();
  ctx.shadowColor = '#ffb400';
  ctx.shadowBlur = 20;
  drawSprite(playerImg, playerFrame, player.x - player.w/2, player.y - player.h/2, player.w, player.h);
  ctx.restore();
}

// ========================
// УПРАВЛЕНИЕ
// ========================
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  fingerX = e.touches[0].clientX;
  hintEl.classList.add('hidden');
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  fingerX = e.touches[0].clientX;
}, { passive:false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  fingerX = null;
}, { passive:false });

// Мышь для теста на ПК
canvas.addEventListener('mousedown', e => { fingerX = e.clientX; });
canvas.addEventListener('mousemove', e => { if (fingerX !== null) fingerX = e.clientX; });
canvas.addEventListener('mouseup', () => { fingerX = null; });

startBtn.onclick = () => {
  startScreen.classList.add('hidden');
  initGame();
};

restartBtn.onclick = () => {
  gameOverScreen.classList.add('hidden');
  initGame();
};

pauseBtn.onclick = () => {
  if (running) { running = false; }
  else { running = true; lastTime = 0; requestAnimationFrame(loop); }
};
</script>
</body>
</html>
